name: JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        run: |
          wget https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Projeyi aç
        run: |
          unzip JARVIS_Android_Proje.zip -d proje

      - name: APK derle
        run: |
          cd proje
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: proje/app/build/outputs/apk/debug/app-debug.apk
